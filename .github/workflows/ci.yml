name: CI

# Manual only, so pushes and PRs spend no Actions minutes. The merge gate is
# tools/ci.sh run locally before pushing (docs/ARCHITECTURE.md, Quality gate).
# Start a run by hand from the Actions tab when a hosted check is wanted.
on:
  workflow_dispatch:

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
      - name: Import, play a headless game, run tests
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 tools/ci.sh
